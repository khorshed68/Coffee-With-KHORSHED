<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Image Studio</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; padding: 24px; background: #f6f0e7; color: #2a1a10; font: 14px/1.5 system-ui, sans-serif; }
    h1 { font: 400 28px Georgia, serif; margin: 0 0 4px; }
    p { margin: 0 0 18px; color: #5c4a3d; }
    #status { font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    figure { margin: 0; background: #fff; border-radius: 12px; padding: 8px; }
    figure img { width: 100%; display: block; border-radius: 8px; }
    figcaption { display: flex; justify-content: space-between; padding: 6px 2px 0; font-size: 12px; }
    figcaption a { color: #8a4b23; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <h1>Menu Image Studio</h1>
  <p>Renders the 13 menu images in 3D. Use the Download links to save new versions into <code>assets/menu/</code> (same file names). <span id="status">Starting…</span></p>
  <div class="grid" id="out"></div>
  <script type="module" src="menu-renderer.js"></script>
</body>
</html>
